name: Build and Deploy to Azure Web App (CI/CD)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'

jobs:
  # =========================================================================
  # 1. Continuous Integration (CI): Restore, Build, and Package
  # =========================================================================
  build:
    name: Build & Package (.NET 9)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore HRMSystem.csproj

      - name: Build Application
        run: dotnet build HRMSystem.csproj --configuration Release --no-restore

      - name: Publish Artifacts
        run: dotnet publish HRMSystem.csproj --configuration Release --no-build --output ./publish

      - name: Upload Build Artifact for Deployment
        uses: actions/upload-artifact@v4
        with:
          name: webapp-artifact
          path: ./publish
          retention-days: 7

  # =========================================================================
  # 2. Continuous Deployment (CD): Deploy to Azure App Service
  # =========================================================================
  deploy:
    name: Deploy to Azure Web App
    needs: build
    # Only deploy when pushing to main or triggering manually
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-artifact
          path: ./publish

      - name: Resolve Web App Name from Publish Profile
        id: resolve_app
        shell: bash
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          CUSTOM_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          if [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Secret AZURE_WEBAPP_PUBLISH_PROFILE is empty or not set! Please add it in GitHub Settings > Secrets and variables > Actions > Secrets."
            exit 1
          fi

          # Extract app name from publish profile XML (msdeploySite or publishUrl)
          DETECTED_NAME=$(echo "$PUBLISH_PROFILE" | grep -o 'msdeploySite="[^"]*"' | head -1 | sed 's/msdeploySite="//;s/"//')
          if [ -z "$DETECTED_NAME" ]; then
            DETECTED_NAME=$(echo "$PUBLISH_PROFILE" | grep -o 'publishUrl="[^"]*"' | head -1 | sed 's/publishUrl="//;s/"//' | cut -d'.' -f1)
          fi

          FINAL_APP_NAME="${CUSTOM_NAME:-$DETECTED_NAME}"
          if [ -z "$FINAL_APP_NAME" ]; then
            FINAL_APP_NAME="hrmsystem-prod"
          fi

          echo "Detected Azure Web App Name: $FINAL_APP_NAME"
          echo "app_name=$FINAL_APP_NAME" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.resolve_app.outputs.app_name }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
